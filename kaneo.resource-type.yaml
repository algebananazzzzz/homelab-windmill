description: Kaneo REST API, authenticated with an API key.
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    base_url:
      type: string
      description: API root without a trailing slash, for example https://kaneo.algebananazzzzz.com/api
    token:
      type: string
      description: Kaneo API key. Point this at a secret variable with $var:, never paste the key in.
  required:
    - base_url
    - token
