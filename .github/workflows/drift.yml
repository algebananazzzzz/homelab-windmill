name: drift

# Git sync commits every Windmill-side change to main, so a difference here means git sync failed.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Singapore, clear of the 00:00 Kaneo run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Windmill matches main
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: |
          result=$(npx wmill sync pull --dry-run --json-output --workspace homelab --base-url https://windmill.algebananazzzzz.com --token "$WMILL_TOKEN")
          if [ "$(echo "$result" | jq .total)" != "0" ]; then
            echo "::error::Windmill differs from main, so git sync has failed. Check the git sync job in Windmill before the next deploy deletes the unsynced change."
            echo "$result" | jq -r '.changes[] | "\(.type) \(.path)"'
            exit 1
          fi
      - name: Every $var reference has a variable
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: scripts/check-vars.sh https://windmill.algebananazzzzz.com homelab "$WMILL_TOKEN"
