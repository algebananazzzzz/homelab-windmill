name: sync

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  WMILL_URL: https://windmill.algebananazzzzz.com
  WMILL_WORKSPACE: homelab

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      # windmill-cli in package.json must match the server version in homelab-komodo, stacks/apps/windmill/compose.yml.
      - run: npm ci
      - name: Show what merging would change
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: npx wmill sync push --dry-run --skip-branch-validation --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    # A push deletes whatever the repo lacks, so two deploys must not overlap.
    concurrency:
      group: windmill-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push the repo to Windmill
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: npx wmill sync push --yes --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"
