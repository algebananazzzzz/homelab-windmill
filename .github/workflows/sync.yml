name: sync

# Content only. The workspace itself, its settings and git sync's files belong to workspace.yml.
on:
  pull_request:
    paths-ignore: &config [settings.yaml, "f/git_sync/**", .github/workflows/workspace.yml]
  push:
    branches: [main]
    paths-ignore: *config
  # After a rebuild, run workspace.yml first.
  workflow_dispatch:

permissions:
  contents: read

env:
  WMILL_URL: https://windmill.algebananazzzzz.com
  WMILL_WORKSPACE: homelab

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wmill lint
      - name: Resources hold no plain-text credentials
        run: |
          leaks=$(grep -rnEi --include='*.resource.yaml' '^\s+[a-z_]*(token|password|secret|key)[a-z_]*:' f | grep -v ': \$var:' || true)
          if [ -n "$leaks" ]; then
            echo "::error::Store these in a secret variable and reference it with \$var:"
            echo "$leaks"
            exit 1
          fi
      # The CLI serialises files in the server's format, so a version skew can push something the server misreads.
      - name: windmill-cli matches the server
        run: |
          server=$(curl -fsS "$WMILL_URL/api/version")
          cli=$(npm pkg get devDependencies.windmill-cli | tr -d '"')
          if [ "${server##* v}" != "$cli" ]; then
            echo "::error::Windmill server is $server but windmill-cli is $cli. Bump package.json with the image in homelab-komodo, stacks/apps/windmill/compose.yml."
            exit 1
          fi

  plan:
    needs: check
    # Fork PRs get no secrets, and the token must never run code a stranger wrote.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show what merging would change
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: npx wmill sync push --dry-run --locks-required --skip-branch-validation --excludes "f/git_sync/**" --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"

  deploy:
    needs: check
    # Windmill git sync commits with a [WM] prefix after the change is already live.
    if: github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message, '[WM]')
    runs-on: ubuntu-24.04
    # A push deletes whatever the repo lacks, so two deploys must not overlap.
    concurrency:
      group: windmill-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push the repo to Windmill
        env:
          WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
        run: npx wmill sync push --yes --locks-required --excludes "f/git_sync/**" --message "${{ github.sha }}" --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"
