name: 2-deploy-workspace

# The workspace itself, its settings (including git sync's config) and git sync's repository.
on:
  push:
    branches: [main]
    paths: &config [settings.yaml, "f/git_sync/**", .github/workflows/2-deploy-workspace.yml]
  # After a rebuild, run this before 3-deploy-content.
  workflow_dispatch:

permissions:
  contents: read

env:
  WMILL_URL: https://windmill.algebananazzzzz.com
  WMILL_WORKSPACE: homelab

jobs:
  deploy:
    # Windmill git sync commits with a [WM] prefix after the change is already live.
    if: ${{ !startsWith(github.event.head_commit.message, '[WM]') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: windmill-deploy
      cancel-in-progress: false
    env:
      WMILL_TOKEN: ${{ secrets.WMILL_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A no-op unless the workspace is gone, as after a rebuild; the token's owner becomes its admin.
      - name: Create the workspace if missing
        run: npx wmill workspace add "$WMILL_WORKSPACE" "$WMILL_WORKSPACE" "$WMILL_URL" --create --create-workspace-name Homelab --token "$WMILL_TOKEN"
      - name: Push the settings and git sync's folder and resource
        run: npx wmill sync push --yes --include-settings --includes "f/git_sync/**" --message "${{ github.sha }}" --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"
      # Runs after the push because the push creates the f/git_sync folder in a new workspace.
      - name: Give git sync its repository URL
        env:
          GIT_SYNC_TOKEN: ${{ secrets.WINDMILL_GIT_SYNC_TOKEN }}
        run: npx wmill variable add "https://x-access-token:$GIT_SYNC_TOKEN@github.com/${{ github.repository }}.git" f/git_sync/repo_url --secret --yes --workspace "$WMILL_WORKSPACE" --base-url "$WMILL_URL" --token "$WMILL_TOKEN"
