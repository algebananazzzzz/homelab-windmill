defaultTs: bun

includes:
  - "f/**"
  - "*.resource-type.yaml"

# Resources sync, but a credential in one must be a $var: reference to a secret variable.
skipResources: false

# Secret variables are created in the Windmill UI, which encrypts them with the workspace key, and never sync.
skipSecrets: true

includeSchedules: true
includeTriggers: true

# settings.yaml is pushed only by 2-deploy-workspace.
includeSettings: false

# Windmill's default for new projects.
nonDottedPaths: true
syncBehavior: v1
