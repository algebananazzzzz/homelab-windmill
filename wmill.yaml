defaultTs: bun

includes:
  - "f/**"

# Resources sync, but a credential in one must be a $var: reference to a secret variable. CI checks this.
skipResources: false

# Secret variables are created in the Windmill UI, which encrypts them with the workspace key, and never sync.
skipSecrets: true

includeSchedules: true
includeTriggers: true

# Windmill's default for new projects.
nonDottedPaths: true
syncBehavior: v1
